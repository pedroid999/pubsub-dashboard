name: Release

# Publishes the package to npm. Two ways to trigger:
#   1. Push a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
#   2. Run manually from the Actions tab (workflow_dispatch) — used for the
#      very first publish of a version whose tag already exists.
#
# Requires a repository secret `NPM_TOKEN` (npm → Access Tokens → Automation,
# which bypasses 2FA). Publishes with provenance, so the published package is
# cryptographically linked to this workflow run + commit.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance (OIDC)

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Verify before release (lint + typecheck + tests + coverage)
        run: |
          npm run lint
          npm run typecheck
          npm run test

      - name: Build (client + server)
        run: npm run build

      - name: Publish to npm (public, with provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
