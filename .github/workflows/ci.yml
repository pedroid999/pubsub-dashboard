name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ['20.x']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers and system dependencies
        run: npx playwright install chromium --with-deps

      - name: Build (client + server)
        run: npm run build

      - name: Verify (lint, format, typecheck, test+coverage, e2e)
        run: npm run verify

  readme-quickstart:
    name: readme-quickstart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Run the README quickstart against the local build (demo seam)
        env:
          # Boot offline (no gcloud/ADC in CI) via the documented demo seam.
          PUBSUB_BIN: node bin/pubsub-dashboard.mjs
          PUBSUB_DEMO_PROJECT: demo-ci-project
          PUBSUB_DEMO_IDENTITY: ci@demo.local
          PORT: '4399'
        run: |
          node scripts/extract-readme-quickstart.mjs README.md > /tmp/quickstart.sh
          cat /tmp/quickstart.sh
          bash /tmp/quickstart.sh
